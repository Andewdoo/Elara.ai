name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run --workspace @elara/web lint
      - run: npm run --workspace @elara/web typecheck
      - run: npm run --workspace @elara/web test
      - run: npm run --workspace @elara/web build
        env: { NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000" }
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -e "apps/api[dev]" -e "apps/worker[dev]"
      - run: python -m compileall -q apps/api/app apps/worker evals
      - name: Python lint
        run: ruff check apps/api apps/worker evals
      - name: Focused Python type checks
        run: mypy --ignore-missing-imports --follow-imports=skip apps/api/app/config.py apps/api/app/observability.py apps/worker/observability evals
      - run: pytest tests
        working-directory: apps/api
        env: { ENVIRONMENT: test }
      - run: pytest tests
        working-directory: apps/worker
        env: { ENVIRONMENT: test }
      - run: pytest evals/tests && python -m evals.harness evals/cases/smoke.json --smoke
      - name: Migration graph check
        working-directory: apps/api
        run: alembic heads && alembic upgrade head --sql > migration.sql
  containers:
    runs-on: ubuntu-latest
    needs: [web, python]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infrastructure/docker/api.Dockerfile -t elara-api:ci .
      - run: docker build -f infrastructure/docker/worker.Dockerfile -t elara-worker:ci .
  security-and-eval-gate:
    runs-on: ubuntu-latest
    needs: [containers]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m evals.harness evals/cases/smoke.json --smoke
      - name: Security suite scaffold
        run: test -d apps/worker/tests && test -d apps/api/tests
