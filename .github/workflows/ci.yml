name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  supply-chain-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: JavaScript production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Python dependency audit
        run: |
          python -m pip install pip-audit
          pip-audit --strict apps/api
          pip-audit --strict apps/worker
      - name: Repository vulnerability and misconfiguration scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: 1
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run --workspace @elara/web lint
      - run: npm run --workspace @elara/web typecheck
      - run: npm run --workspace @elara/web test
      - run: npm run --workspace @elara/web build
        env: { NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000" }
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -e "apps/api[dev]" -e "apps/worker[dev]"
      - run: python -m compileall -q apps/api/app apps/worker evals
      - name: Python lint
        run: ruff check apps/api apps/worker evals
      - name: Focused Python type checks
        run: mypy --ignore-missing-imports --follow-imports=skip apps/api/app/config.py apps/api/app/observability.py apps/worker/observability evals
      - run: pytest tests
        working-directory: apps/api
        env: { ENVIRONMENT: test }
      - run: pytest tests
        working-directory: apps/worker
        env: { ENVIRONMENT: test }
      - run: python -m pytest evals/tests && python -m evals.harness evals/cases/smoke.json --smoke
      - name: Migration graph check
        working-directory: apps/api
        run: |
          test "$(alembic heads | wc -l)" -eq 1
          alembic upgrade head --sql > migration-up.sql
          alembic downgrade head:base --sql > migration-down.sql
  containers:
    runs-on: ubuntu-latest
    needs: [web, python]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infrastructure/docker/api.Dockerfile -t elara-api:ci .
      - run: docker build -f infrastructure/docker/worker.Dockerfile -t elara-worker:ci .
  full-stack-acceptance:
    runs-on: ubuntu-latest
    needs: [web, python]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Deterministic full-stack acceptance
        run: docker compose -f docker-compose.acceptance.yml up --build --abort-on-container-exit --exit-code-from acceptance
      - name: Acceptance service logs
        if: failure()
        run: docker compose -f docker-compose.acceptance.yml logs --no-color
      - name: Stop acceptance stack
        if: always()
        run: docker compose -f docker-compose.acceptance.yml down --volumes --remove-orphans
  security-and-eval-gate:
    runs-on: ubuntu-latest
    needs: [containers, full-stack-acceptance, supply-chain-security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -e "apps/api[dev]" -e "apps/worker[dev]"
      - run: python -m evals.harness evals/cases/smoke.json --smoke
      - name: API security regressions
        run: pytest apps/api/tests/test_security_hardening.py apps/api/tests/test_uploads.py apps/api/tests/test_auth_routes.py apps/api/tests/test_firebase_gateway.py apps/api/tests/test_sse_events.py apps/api/tests/test_verifications.py apps/api/tests/test_queueing_and_redis.py apps/api/tests/test_run_lifecycle.py
      - name: Worker security and deterministic regressions
        run: pytest apps/worker/tests/test_url_guard_and_fetcher.py apps/worker/tests/test_search_ranking_extraction.py apps/worker/tests/test_agent_schemas.py apps/worker/tests/test_workflow.py apps/worker/tests/test_verification_task.py apps/worker/tests/test_scoring_formulas.py apps/worker/tests/test_numerical_audit.py apps/worker/tests/test_provenance.py apps/worker/tests/test_retrieval_persistence.py apps/worker/tests/test_deepseek_client.py
