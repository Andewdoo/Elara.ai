name: Deployment gates
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  staging-gate:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - run: echo "CI passed; GitHub-connected staging services may deploy this revision."
      - name: Staging API smoke check
        if: vars.STAGING_API_BASE_URL != ''
        env:
          API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
        run: curl --fail --retry 3 --retry-delay 5 "$API_BASE_URL/health"
  production-gate:
    needs: [staging-gate]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Production approval granted; GitHub-connected hosts may promote this revision."
      - name: Production API smoke check
        if: vars.PRODUCTION_API_BASE_URL != ''
        env:
          API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL }}
        run: curl --fail --retry 3 --retry-delay 5 "$API_BASE_URL/health"
# Vercel deploys apps/web through its GitHub integration. No Vercel or registry
# credential is required by this repository workflow.
