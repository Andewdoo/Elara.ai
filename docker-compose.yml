services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file:
      - path: .env.private
        required: false
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  object-storage:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    env_file:
      - path: .env.private
        required: false
    entrypoint:
      - /bin/sh
      - -ec
      - >
        export MINIO_ROOT_USER="$${S3_ACCESS_KEY_ID:-elara-local-access-key}" &&
        export MINIO_ROOT_PASSWORD="$${S3_SECRET_ACCESS_KEY:-elara-local-secret-key}" &&
        exec minio server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  object-storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    env_file:
      - path: .env.private
        required: false
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set elara http://object-storage:9000
        "$${S3_ACCESS_KEY_ID:-elara-local-access-key}"
        "$${S3_SECRET_ACCESS_KEY:-elara-local-secret-key}" &&
        mc mb --ignore-existing "elara/$${S3_BUCKET_NAME:-elara-local}" &&
        mc anonymous set none "elara/$${S3_BUCKET_NAME:-elara-local}"
    depends_on:
      object-storage:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    profiles: ["app"]
    env_file:
      - path: .env.private
        required: false
    environment:
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000}
      # Docker on this workstation is reached through IPv4 because another
      # development server owns the IPv6 localhost listener. Keep both exact
      # loopback origins available for the credentialed local auth flow.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ELARA_DOCKER_DATABASE_HOST: postgres
      PASSAGE_EMBEDDING_DIMENSION: ${PASSAGE_EMBEDDING_DIMENSION:-1536}
      # These values intentionally do not interpolate host or .env.private
      # variables: localhost inside a container is the container itself.
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # Containers must reach MinIO over the Compose network.  A host-facing
      # localhost endpoint from .env.private is only valid outside Docker.
      S3_ENDPOINT_URL: http://object-storage:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-elara-local}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # Local MinIO has no KMS. Production retains the Settings default of AES256.
      S3_SERVER_SIDE_ENCRYPTION: none
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-brave}
      SEARCH_BASE_URL: ${SEARCH_BASE_URL:-https://api.search.brave.com/res/v1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    profiles: ["app"]
    env_file:
      - path: .env.private
        required: false
    environment:
      ELARA_DOCKER_DATABASE_HOST: postgres
      PASSAGE_EMBEDDING_DIMENSION: ${PASSAGE_EMBEDDING_DIMENSION:-1536}
      # Keep the worker on the Compose network even when .env.private contains
      # host-development Redis URLs for local non-container tools.
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # Containers must reach MinIO over the Compose network.  A host-facing
      # localhost endpoint from .env.private is only valid outside Docker.
      S3_ENDPOINT_URL: http://object-storage:9000
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-elara-local}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # Local MinIO has no KMS. Production retains the Settings default of AES256.
      S3_SERVER_SIDE_ENCRYPTION: none
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
    # A warm Celery shutdown must outlive the 16-minute hard task limit.  This
    # lets an in-flight verification finish before Compose replaces the worker.
    stop_grace_period: 17m
    volumes:
      - fetch-storage-data:/var/lib/elara/fetch

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    profiles: ["app"]
    env_file:
      - path: .env.private
        required: false
    environment:
      # Match the Docker-published IPv4 loopback address used by the local web
      # app, while retaining localhost as an allowed API CORS origin above.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres-data:
  redis-data:
  object-storage-data:
  fetch-storage-data:
