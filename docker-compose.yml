services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elara}
      POSTGRES_USER: ${POSTGRES_USER:-elara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elara-local-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  object-storage:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-elara-local-access-key}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-elara-local-secret-key}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  object-storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set elara http://object-storage:9000
        "${S3_ACCESS_KEY_ID:-elara-local-access-key}"
        "${S3_SECRET_ACCESS_KEY:-elara-local-secret-key}" &&
        mc mb --ignore-existing "elara/${S3_BUCKET_NAME:-elara-local}" &&
        mc anonymous set none "elara/${S3_BUCKET_NAME:-elara-local}"
    depends_on:
      object-storage:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    profiles: ["app"]
    env_file:
      - path: .env.private
        required: false
    environment:
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://elara:elara-local-password@postgres:5432/elara}
      PASSAGE_EMBEDDING_DIMENSION: ${PASSAGE_EMBEDDING_DIMENSION:-1536}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://object-storage:9000}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-elara-local}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-brave}
      SEARCH_BASE_URL: ${SEARCH_BASE_URL:-https://api.search.brave.com/res/v1}
      SENTRY_DSN_API: ${SENTRY_DSN_API:-}
      SENTRY_ORG: ${SENTRY_ORG:-}
      SENTRY_PROJECT_API: ${SENTRY_PROJECT_API:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    profiles: ["app"]
    env_file:
      - path: .env.private
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://elara:elara-local-password@postgres:5432/elara}
      PASSAGE_EMBEDDING_DIMENSION: ${PASSAGE_EMBEDDING_DIMENSION:-1536}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://object-storage:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-elara-local}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_CHAT_MODEL: ${DEEPSEEK_CHAT_MODEL:-deepseek-chat}
      DEEPSEEK_REASONING_MODEL: ${DEEPSEEK_REASONING_MODEL:-deepseek-reasoner}
      DEEPSEEK_EMBEDDING_MODEL: ${DEEPSEEK_EMBEDDING_MODEL:-}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-brave}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      SEARCH_BASE_URL: ${SEARCH_BASE_URL:-https://api.search.brave.com/res/v1}
      SENTRY_DSN_WORKER: ${SENTRY_DSN_WORKER:-}
      SENTRY_ORG: ${SENTRY_ORG:-}
      SENTRY_PROJECT_WORKER: ${SENTRY_PROJECT_WORKER:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-elara-local}
      DEEPSEEK_INPUT_COST_PER_MILLION_TOKENS: ${DEEPSEEK_INPUT_COST_PER_MILLION_TOKENS:-0}
      DEEPSEEK_OUTPUT_COST_PER_MILLION_TOKENS: ${DEEPSEEK_OUTPUT_COST_PER_MILLION_TOKENS:-0}
      SEARCH_COST_PER_REQUEST: ${SEARCH_COST_PER_REQUEST:-0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
    volumes:
      - fetch-storage-data:/var/lib/elara/fetch

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    profiles: ["app"]
    env_file:
      - path: .env.private
        required: false
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres-data:
  redis-data:
  object-storage-data:
  fetch-storage-data:
