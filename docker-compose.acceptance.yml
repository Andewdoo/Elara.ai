services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: elara_acceptance
      POSTGRES_USER: elara
      POSTGRES_PASSWORD: acceptance-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elara -d elara_acceptance"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  object-storage:
    image: quay.io/minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: acceptance-access-key
      MINIO_ROOT_PASSWORD: acceptance-secret-key
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: ["/bin/sh", "-c", "alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment: &acceptance-environment
      ENVIRONMENT: test
      ACCEPTANCE_TEST_MODE: "true"
      DATABASE_URL: postgresql+psycopg://elara:acceptance-password@postgres:5432/elara_acceptance
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      S3_ENDPOINT_URL: http://object-storage:9000
      S3_PUBLIC_ENDPOINT_URL: http://object-storage:9000
      S3_ACCESS_KEY_ID: acceptance-access-key
      S3_SECRET_ACCESS_KEY: acceptance-secret-key
      S3_BUCKET_NAME: elara-acceptance
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      S3_SERVER_SIDE_ENCRYPTION: "none"
      FIREBASE_SESSION_COOKIE_NAME: elara_session
      WEB_APP_URL: http://web.test
      CORS_ALLOWED_ORIGINS: http://web.test
      WORKFLOW_VERSION: step-20-acceptance
      CITATION_REVISION_LIMIT: "1"
      PASSAGE_EMBEDDING_DIMENSION: "8"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    command: ["python", "-m", "celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=1", "--queues=verification.quick,verification.standard,verification.deep"]
    environment: *acceptance-environment
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy

  acceptance:
    build:
      context: .
      dockerfile: infrastructure/docker/acceptance.Dockerfile
    environment:
      <<: *acceptance-environment
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
