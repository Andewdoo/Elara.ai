services:
  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  object-storage:
    restart: unless-stopped

  api:
    restart: unless-stopped

  worker:
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    profiles: ["app"]
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  caddy-data:
  caddy-config:
