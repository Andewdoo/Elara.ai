services:
  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  object-storage:
    restart: unless-stopped

  api:
    restart: unless-stopped
    environment:
      # The public-beta stack persists evidence in the private AWS bucket
      # provisioned by CloudFormation. Keep Compose MinIO limited to local
      # development and use path-style=false for the regional AWS endpoint.
      S3_ENDPOINT_URL: ${PUBLIC_BETA_S3_ENDPOINT_URL:-https://s3.us-east-1.amazonaws.com}
      S3_PUBLIC_ENDPOINT_URL: ${PUBLIC_BETA_S3_ENDPOINT_URL:-https://s3.us-east-1.amazonaws.com}
      # Empty explicit credentials make boto3 use the EC2 instance role rather
      # than local MinIO keys loaded from .env.private.
      S3_ACCESS_KEY_ID: ""
      S3_SECRET_ACCESS_KEY: ""
      S3_FORCE_PATH_STYLE: "false"
      S3_SERVER_SIDE_ENCRYPTION: AES256

  worker:
    # Celery exits promptly when Redis is unavailable; Compose provides a
    # bounded recovery window suitable for the owner-operated demo.
    restart: on-failure:3
    environment:
      S3_ENDPOINT_URL: ${PUBLIC_BETA_S3_ENDPOINT_URL:-https://s3.us-east-1.amazonaws.com}
      S3_PUBLIC_ENDPOINT_URL: ${PUBLIC_BETA_S3_ENDPOINT_URL:-https://s3.us-east-1.amazonaws.com}
      S3_ACCESS_KEY_ID: ""
      S3_SECRET_ACCESS_KEY: ""
      S3_FORCE_PATH_STYLE: "false"
      S3_SERVER_SIDE_ENCRYPTION: AES256
    healthcheck:
      test: ["CMD-SHELL", "python -m celery -A app.celery_app:celery_app inspect ping --timeout=3 | grep -q pong"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2.10-alpine
    profiles: ["app"]
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  caddy-data:
  caddy-config:
