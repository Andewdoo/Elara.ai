[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "elara-worker"
version = "0.1.0"
description = "Elara.ai Celery verification worker"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "boto3>=1.35,<2",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "langsmith>=0.4,<1",
  "pydantic>=2.10,<3",
  "pymupdf>=1.25,<2",
  "redis>=5.2,<6",
  "sentry-sdk[celery]>=2.22,<3",
  "trafilatura>=2.0,<3",
]

[project.optional-dependencies]
dev = ["mypy>=1.14,<2", "pytest>=8.3,<9", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["acceptance*", "agents*", "auditing*", "elara_worker*", "extraction*", "graph*", "observability*", "provenance*", "research*", "scoring*"]
