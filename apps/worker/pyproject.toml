[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "elara-worker"
version = "0.1.0"
description = "Elara.ai Celery verification worker"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["agents*", "elara_worker*", "graph*"]
